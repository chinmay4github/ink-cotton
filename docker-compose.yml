# Ink & Cotton - whole platform locally:  docker compose up --build
#   shop    http://localhost:3000      sell  http://localhost:3001
#   deliver http://localhost:3002      admin http://localhost:3003
#   api     http://localhost:4000/docs
# The API creates the schema, applies migrations and seeds demo data on first boot.
x-web: &web
  depends_on: [api]
  environment: &webenv
    API_URL: http://api:4000

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: inkandcotton }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d inkandcotton"], interval: 5s, retries: 10 }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/inkandcotton
      JWT_SECRET: change-me-to-a-long-random-string-in-production
      AUTO_SEED: "true"
      NODE_ENV: production
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]

  shop:
    <<: *web
    build: { context: ., dockerfile: docker/next.Dockerfile, args: { APP: shop, NEXT_PUBLIC_SELL_URL: "http://localhost:3001", NEXT_PUBLIC_DELIVER_URL: "http://localhost:3002" } }
    ports: ["3000:3000"]
  sell:
    <<: *web
    build: { context: ., dockerfile: docker/next.Dockerfile, args: { APP: sell, NEXT_PUBLIC_SHOP_URL: "http://localhost:3000" } }
    ports: ["3001:3000"]
  deliver:
    <<: *web
    build: { context: ., dockerfile: docker/next.Dockerfile, args: { APP: deliver } }
    ports: ["3002:3000"]
  admin:
    <<: *web
    build: { context: ., dockerfile: docker/next.Dockerfile, args: { APP: admin, NEXT_PUBLIC_SHOP_URL: "http://localhost:3000" } }
    ports: ["3003:3000"]

volumes:
  pgdata:
